<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Nie ma takiej strony | KaDeStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#131517;--card:#1B1E21;--line:#2A2E33;--line2:#3A3F45;--head:#F5F6F7;--muted:#9BA1A8;--accent:#FF6B3D;--accent-hi:#FF8A63}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--muted);font:300 16px/1.6 "Sora","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:40px 20px}
main{max-width:560px;display:grid;gap:22px}
.logo{display:flex;align-items:center;gap:10px;color:var(--head);font-weight:600;text-decoration:none}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:.74rem;font-weight:700}
.code{font:500 .8rem "IBM Plex Mono",monospace;color:var(--accent-hi);letter-spacing:.08em}
h1{margin:0;color:var(--head);font-weight:600;font-size:clamp(2rem,6vw,2.8rem);line-height:1.08;letter-spacing:-.04em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
a.l{display:flex;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--head);text-decoration:none}
a.l:hover{border-color:var(--line2)}
.btn{justify-self:start;padding:14px 22px;border-radius:12px;background:var(--accent);color:var(--bg);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <a class="logo" href="/"><span class="mark">KD</span>KaDeStudio</a>
  <span class="code">BŁĄD 404</span>
  <h1>Nie ma takiej strony</h1>
  <p>Adres mógł się zmienić albo zawiera literówkę. Tu znajdziesz to, czego zwykle ludzie szukają:</p>
  <ul>
    <li><a class="l" href="/strony-internetowe/">Strony internetowe <span>→</span></a></li>
    <li><a class="l" href="/sklepy-internetowe/">Sklepy internetowe <span>→</span></a></li>
    <li><a class="l" href="/platformy-b2b/">Platformy B2B <span>→</span></a></li>
    <li><a class="l" href="/aplikacje-mobilne/">Aplikacje mobilne <span>→</span></a></li>
  </ul>
  <a class="btn" href="/">Wróć na stronę główną</a>
</main>
</body>
</html>
